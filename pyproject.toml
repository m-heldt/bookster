[project]
name = "bookster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateusz Heldt", email = "23269740+m-heldt@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "epublib>=0.1.7",
    "httpx2>=2.16.0",
    "langcodes>=3.5.1",
    "openai>=3.42.1",
    "openinference-instrumentation-openai>=0.1.69",
    "pydantic>=2.14.2",
    "pydantic-extra-types>=2.11.1",
    "pymupdf>=2.1",
    "pypdf>=6.21.4",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
bookster = "bookster:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
